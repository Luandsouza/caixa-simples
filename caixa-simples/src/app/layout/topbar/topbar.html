<header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-6">

  <!-- IDENTIFICAÇÃO DA EMPRESA -->
  <div>
    <h1 class="text-lg font-bold text-slate-800">
      LS Sitemas
    </h1>

    <p class="text-sm text-slate-500">
      {{ dataAtual }}
    </p>
  </div>

  <!-- AÇÕES -->
  <div class="flex items-center gap-5">

    <!-- NOTIFICAÇÕES -->
    <button
      class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 transition-colors"
      title="Notificações"
    >
      <svg lucideBell [size]="22"></svg>
    </button>

    <!-- PERFIL -->
    <button
      class="flex items-center gap-2 p-2 rounded-lg hover:bg-slate-100 transition-colors"
      title="Perfil do usuário"
    >
      <div class="w-9 h-9 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold">
        LU
      </div>
    </button>

  </div>

</header>
