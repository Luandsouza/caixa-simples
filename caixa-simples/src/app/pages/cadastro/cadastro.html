<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4 py-10">

    <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/60 sm:p-9">

        <!-- APRESENTAÇÃO -->
        <div class="flex flex-col items-center text-center">

            <img src="/imagens/Logo fintech Caixa Simples.png" alt="Logo Caixa Simples"
                class="h-20 w-auto object-contain">

            <h3 class="mt-6 text-2xl font-bold tracking-tight text-slate-900">
                Crie sua conta gratuitamente
            </h3>

            <p class="mt-2 text-sm leading-relaxed text-slate-500">
                Comece a organizar o financeiro do seu negócio.
            </p>

        </div>

        <!-- FORMULÁRIO -->
        <div class="mt-8 space-y-5">

            <!-- NOME -->
            <div>
                <label for="campo-nome" class="mb-2 block text-sm font-semibold text-slate-700">
                    Seu nome
                </label>

                <input type="text" id="campo-nome" placeholder="Ex.: Luan Souza"
                    class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-100">
            </div>

            <!-- EMPRESA -->
            <div>
                <label for="campo-nome-empresa" class="mb-2 block text-sm font-semibold text-slate-700">
                    Nome da empresa ou negócio
                </label>

                <input type="text" id="campo-nome-empresa" placeholder="Ex.: Serviços LTDA"
                    class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-100">
            </div>

            <!-- EMAIL -->
            <div>
                <label for="campo-email" class="mb-2 block text-sm font-semibold text-slate-700">
                    E-mail
                </label>

                <input type="email" id="campo-email" placeholder="seu@email.com"
                    class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-100">
            </div>

            <!-- SENHA -->
            <div>
                <label for="campo-senha" class="mb-2 block text-sm font-semibold text-slate-700">
                    Senha
                </label>

                <div class="relative">

                    <input [type]="mostrarSenha ? 'text' : 'password'" id="campo-senha"
                        placeholder="Mínimo de 8 caracteres"
                        class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 pr-12 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-100">

                    <button type="button" (click)="mostrarSenha = !mostrarSenha"
                        class="absolute right-4 top-1/2 -translate-y-1/2 text-lg text-slate-500 transition hover:text-blue-600"
                        [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'">
                        {{ mostrarSenha ? '🙈' : '👁' }}
                    </button>

                </div>
            </div>

        </div>

        <!-- BOTÃO CADASTRAR -->
        <div class="mt-8">


            
            <button type="button" (click)="mostrarSenha = !mostrarSenha"
                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 transition hover:text-blue-600"
                [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'">
                @if (mostrarSenha) {
                <!-- OLHO ABERTO -->
                <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
                } @else {
                <!-- OLHO COM RISCO -->
                <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3l18 18" />
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                    <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a13.8 13.8 0 0 1-3 3.8" />
                    <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.2 0 2.3-.2 3.3-.6" />
                </svg>
                }
            </button>


        </div>

        <!-- LOGIN -->
        <div class="mt-6 border-t border-slate-100 pt-6 text-center">

            <p class="text-sm text-slate-500">
                Já tem uma conta?

                <a routerLink="/login" class="font-semibold text-blue-600 transition hover:text-blue-700">
                    Entrar
                </a>
            </p>

        </div>

        <!-- RODAPÉ -->
        <p class="mt-8 text-center text-xs text-slate-400">
            © 2026 Caixa Simples. Todos os direitos reservados.
        </p>

    </div>

</div>
